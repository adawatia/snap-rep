[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "snaprep-dynamic-color"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["flet>=1.0.5"]

[tool.flet.extensions.snaprep_dynamic_color]
path = "flutter/snaprep_dynamic_color"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"flutter.snaprep_dynamic_color" = ["**/*"]
